<body>
    <header>
        <img src="imágenes logo/logosinfondo.png" alt="Logo de la empresa" class="logo">
        <nav>
            <aside id="nav-aside">
                <ul>
                    <li><a href="Index.html">Inicio</a></li>

                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </aside>
        </nav>
    </header>

    <main>
        <section id="main_contacto">
            <fieldset>
                <h1 id="titulo_fieldset">Contáctanos</h1>
                    <form action="morning-paper-a0fc.contry-1990.workers.dev" method="post" enctype="multipart/form-data">
                        <img src="iconos contacto/icono persona.png" alt="personita" class="iconos"><input type="text" id="name" name="name" placeholder="Nombre" required><img src="iconos contacto/icono arroba.png" alt="arroba" class="iconos"><input type="email" id="email" name="email" placeholder="Email" required><br>
                        <img src="iconos contacto/icono telefono.png" alt="telefono" class="iconos"><input type="tel" id="phone" name="phone" placeholder="Teléfono" required><img src="iconos contacto/icono sexo.png" alt="sexo" class="iconos"><select id="sexo" name="sexo" required>
                            <option value="" disabled selected>Selecciona tu sexo</option>
                            <option value="masculino">Masculino</option>
                            <option value="femenino">Femenino</option>
                            <option value="otro">Otro</option>
                        </select><br>
                        <select id="motivo" name="motivo" required>
                            <option value="" disabled selected>Selecciona el motivo</option>
                            <option value="consulta">Consulta</option>
                            <option value="soporte">Soporte</option>
                            <option value="otros">Otros</option>
                        </select><br>
                        <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." minlength="10" required></textarea><br>
                        <label for="privacidad">
                        <input type="checkbox" id="privacidad" name="privacidad" required>
                        Acepto la política de privacidad
                        </label>
                        <input type="submit" value="Enviar" class="btn-submit">
                    </form>
                </fieldset>
        </section>
    </main>
